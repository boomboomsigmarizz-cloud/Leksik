<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LX SYSTEM</title><style>
:root{
  --bg:#000;
  --fg:#f5f5f5;
  --muted:#aaa;
  --accent:#0f0;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"JetBrains Mono", monospace;
  overflow:hidden;
}

/* desktop area */
#desktop{
  position:fixed; inset:0;
}

/* windows */
.window{
  position:absolute;
  background:rgba(0,0,0,0.75);
  border:1px solid #333;
  border-radius:12px;
  backdrop-filter: blur(10px);
  padding:10px;
  width:320px; max-width:92vw;
  touch-action:none; /* for drag */
}
.window:hover{ border-color:#fff }

.title{ font-size:12px; color:var(--muted); margin-bottom:6px }
.terminal{ font-size:13px; white-space:pre-line }
.input{ width:100%; border:none; outline:none; background:transparent; color:var(--accent); font-family:inherit }

button{
  background:#fff; color:#000; border:none; padding:6px 10px; margin-right:6px; border-radius:6px;
}

/* positions (desktop) */
#links{ top:20px; left:20px }
#music{ top:20px; right:20px }
#system{ bottom:20px; left:20px }
#visual{ bottom:20px; right:20px }
#center{ top:50%; left:50%; transform:translate(-50%,-50%); width:420px; max-width:95vw }

.matrix{ font-size:10px; color:var(--accent); height:150px; overflow:hidden }

/* MOBILE LAYOUT */
@media (max-width: 768px){
  body{ overflow:auto }
  #desktop{ position:relative; padding:10px; display:grid; gap:10px; grid-template-columns:1fr }
  .window{ position:relative; width:100%; left:auto; top:auto; transform:none }
  #center{ order:-1 }
}
</style></head><body>
<div id="desktop"><!-- LINKS --><div class="window" id="links">
  <div class="title">adapter://links</div>
  <div class="terminal">
> connections:\n
<span onclick="openLink('https://guns.lol/leksik')" style="color:#0f0;cursor:pointer;">guns.lol/leksik</span>\n
<span onclick="openLink('https://leksik.carrd.co/')" style="color:#0f0;cursor:pointer;">bio</span>
  </div>
</div><!-- MUSIC --><div class="window" id="music">
  <div class="title">adapter://music</div>
  <div class="terminal">
> alex.mp3\n
<button onclick="playMusic()">play</button>
<button onclick="stopMusic()">stop</button>
  </div>
</div><!-- SYSTEM --><div class="window" id="system">
  <div class="title">adapter://system</div>
  <div class="terminal">
user: leksik\nlang: python / bash / js / c#\nfocus: osint, network\n\nstatus: active
  </div>
</div><!-- MATRIX --><div class="window" id="visual">
  <div class="title">adapter://visual</div>
  <div class="matrix" id="matrix"></div>
</div><!-- CENTER --><div class="window" id="center">
  <div class="title">LX // adapter</div>
  <div class="terminal" id="terminal">\n> system booted\n\ntype help</div>
  <input class="input" id="input" autofocus>
</div></div><audio id="audio" src="alex.mp3"></audio>

<script>

/* DRAG (mouse + touch) */
function makeDraggable(el){
  let startX=0, startY=0, x=0, y=0, dragging=false;

  const onStart = (e)=>{
    dragging=true;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX - el.offsetLeft;
    startY = p.clientY - el.offsetTop;
    el.style.zIndex = ++z;
  };

  const onMove = (e)=>{
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    x = p.clientX - startX;
    y = p.clientY - startY;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  };

  const onEnd = ()=> dragging=false;

  el.addEventListener('mousedown', onStart);
  el.addEventListener('touchstart', onStart, {passive:true});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:true});
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
}

let z=1;
document.querySelectorAll('.window').forEach(makeDraggable);

/* TERMINAL */
const input = document.getElementById('input');
const term = document.getElementById('terminal');

input.addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    const cmd=input.value.trim();
    term.innerHTML += '\n> ' + cmd;
    runCommand(cmd);
    input.value='';
  }
});

function runCommand(cmd){
  if(cmd==='help') term.innerHTML+='\nhelp, clear, whoami, links';
  else if(cmd==='clear') term.innerHTML='';
  else if(cmd==='whoami') term.innerHTML+='\nleksik // LX';
  else if(cmd==='links') term.innerHTML+='\nguns.lol/leksik\nleksik.carrd.co';
  else term.innerHTML+='\ncommand not found';
}

/* MUSIC */
function playMusic(){ document.getElementById('audio').play(); }
function stopMusic(){ const a=document.getElementById('audio'); a.pause(); a.currentTime=0; }

/* LINKS */
function openLink(url){ window.open(url, '_blank'); }

/* MATRIX */
const matrix = document.getElementById('matrix');
function generateMatrix(){
  let text=''; const chars='01';
  for(let i=0;i<200;i++){ text+=chars[Math.floor(Math.random()*chars.length)]+' '; if(i%20===0) text+='\n'; }
  matrix.innerText=text;
}
setInterval(generateMatrix,120);

</script></body>
</html>
