<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LX Project — Luxury</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050505;
  --glass:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.15);
  --muted:rgba(255,255,255,.6);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:#fff;
  overflow-x:hidden;
}

/* ===== Scroll Progress ===== */
.progress{
  position:fixed;top:0;left:0;height:3px;width:0%;
  background:#fff;z-index:9999;transition:width .1s linear;
}

/* ===== Cursor Light ===== */
.cursor-light{
  position:fixed;
  width:500px;height:500px;
  background:radial-gradient(circle, rgba(255,255,255,.12) 0%, transparent 60%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:0;
  mix-blend-mode:screen;
}

/* ===== Background ===== */
.bg{
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.05), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,.04), transparent 40%),
    #000;
  animation:floatBg 20s ease-in-out infinite alternate;
}
@keyframes floatBg{
  from{background-position:0 0, 0 0;}
  to{background-position:50px 30px, -50px -30px;}
}

/* ===== Nav ===== */
nav{
  position:fixed;top:0;width:100%;
  display:flex;justify-content:space-between;align-items:center;
  padding:25px 60px;
  backdrop-filter:blur(20px);
  background:linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
  z-index:10;
}
.logo{font-weight:800;letter-spacing:3px;}
.nav-links a{
  margin-left:30px;text-decoration:none;color:#fff;opacity:.6;transition:.3s;
}
.nav-links a:hover{opacity:1;}

/* ===== Sections ===== */
section{
  min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:0 20px;
}
.hero h1{
  font-size:clamp(42px,7vw,100px);
  font-weight:800;
  letter-spacing:-2px;
}
.hero p{margin-top:20px;color:var(--muted);}
.btn{
  margin-top:40px;padding:15px 45px;
  border:1px solid var(--border);
  border-radius:40px;text-decoration:none;color:#fff;
  transition:.3s;
}
.btn:hover{background:#fff;color:#000;}

/* ===== Projects ===== */
.projects h2,
.connect h2{
  font-size:60px;margin-bottom:60px;
}
.cards{
  display:flex;gap:30px;flex-wrap:wrap;justify-content:center;
}
.card{
  width:280px;padding:50px 30px;
  border-radius:25px;
  background:var(--glass);
  backdrop-filter:blur(30px);
  border:1px solid var(--border);
  transition:.4s ease;
}
.card:hover{
  transform:translateY(-15px) scale(1.02);
  background:rgba(255,255,255,.1);
}
.card span{opacity:.5;}

/* ===== Links ===== */
.links a{
  display:block;margin:18px 0;font-size:26px;
  text-decoration:none;color:#fff;opacity:.7;
  transition:.3s;
}
.links a:hover{opacity:1;letter-spacing:3px;}

/* ===== Reveal Animation ===== */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:1s ease;
}
.reveal.active{
  opacity:1;
  transform:translateY(0);
}

/* ===== Music Player ===== */
.player{
  position:fixed;bottom:25px;right:25px;
  background:var(--glass);
  backdrop-filter:blur(30px);
  border:1px solid var(--border);
  padding:20px 25px;border-radius:25px;
  width:260px;
}
.play-btn{
  width:45px;height:45px;border-radius:50%;
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;margin-bottom:10px;
  transition:.3s;
}
.play-btn:hover{background:#fff;color:#000;}
.progress-bar{
  width:100%;height:4px;background:rgba(255,255,255,.1);
  border-radius:5px;overflow:hidden;margin-top:10px;
}
.progress-bar div{
  height:100%;width:0%;background:#fff;
}

/* ===== Mobile ===== */
@media(max-width:768px){
  nav{padding:20px;}
  .nav-links{display:none;}
}
</style>
</head>

<body>

<div class="progress" id="scrollProgress"></div>
<div class="cursor-light" id="cursorLight"></div>
<div class="bg"></div>

<nav>
  <div class="logo">LX PROJECT</div>
  <div class="nav-links">
    <a href="#projects">Projects</a>
    <a href="#connect">Connect</a>
  </div>
</nav>

<section class="hero reveal">
  <h1>System Under Control.</h1>
  <p>Luxury Official Platform</p>
  <a href="#projects" class="btn">Explore</a>
</section>

<section class="projects reveal" id="projects">
  <h2>Projects.</h2>
  <div class="cards">
    <div class="card">
      <h3>LX Core</h3>
      <span>Coming Soon</span>
    </div>
    <div class="card">
      <h3>LX Tools</h3>
      <span>Coming Soon</span>
    </div>
    <div class="card">
      <h3>LX Launcher</h3>
      <span>Coming Soon</span>
    </div>
  </div>
</section>

<section class="connect reveal" id="connect">
  <h2>Connect.</h2>
  <div class="links">
    <a href="https://t.me/leksiktw" target="_blank">Telegram</a>
    <a href="#">Discord — @dobryaaaak</a>
    <a href="https://www.tiktok.com/@sigma.skibiditoilet.rizz" target="_blank">TikTok</a>
    <a href="https://guns.lol/leksik" target="_blank">Guns</a>
    <a href="https://leksik.carrd.co/" target="_blank">Bio</a>
  </div>
</section>

<div class="player">
  <div class="play-btn" onclick="toggleMusic()">▶</div>
  <div>Alex — LX Theme</div>
  <div class="progress-bar"><div id="musicProgress"></div></div>
  <audio id="audio" src="alex.mp3"></audio>
</div>

<script>
/* Scroll Progress */
window.addEventListener("scroll",()=>{
  let scrollTop=document.documentElement.scrollTop;
  let height=document.documentElement.scrollHeight-document.documentElement.clientHeight;
  document.getElementById("scrollProgress").style.width=(scrollTop/height)*100+"%";
});

/* Reveal */
const reveals=document.querySelectorAll(".reveal");
window.addEventListener("scroll",()=>{
  reveals.forEach(r=>{
    if(r.getBoundingClientRect().top<window.innerHeight-100){
      r.classList.add("active");
    }
  });
});

/* Cursor Light */
const cursor=document.getElementById("cursorLight");
document.addEventListener("mousemove",e=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

/* Music */
const audio=document.getElementById("audio");
const progress=document.getElementById("musicProgress");
function toggleMusic(){
  if(audio.paused){audio.play();event.target.innerHTML="❚❚";}
  else{audio.pause();event.target.innerHTML="▶";}
}
audio.addEventListener("timeupdate",()=>{
  progress.style.width=(audio.currentTime/audio.duration)*100+"%";
});
</script>

</body>
</html>
