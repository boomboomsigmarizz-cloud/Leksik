<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LX Project</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0a0a0f;
    --bg2:#111118;
    --text:#ffffff;
    --accent:#8b5cf6;
    --glass:rgba(255,255,255,0.05);
    --blur:blur(20px);
}

.light{
    --bg:#f2f2f7;
    --bg2:#ffffff;
    --text:#111;
    --accent:#6d28d9;
    --glass:rgba(0,0,0,0.05);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    transition:0.4s ease;
}

/* ===== Cursor Glow ===== */
.cursor{
    position:fixed;
    width:300px;
    height:300px;
    background:radial-gradient(circle, var(--accent) 0%, transparent 60%);
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:.15;
    transform:translate(-50%,-50%);
    z-index:0;
}

/* ===== Navbar ===== */
nav{
    position:fixed;
    top:0;
    width:100%;
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    backdrop-filter:var(--blur);
    background:var(--glass);
    z-index:100;
}

.logo{
    font-weight:800;
    font-size:20px;
    letter-spacing:2px;
    cursor:pointer;
    transition:0.3s;
}

.logo:hover{
    text-shadow:0 0 20px var(--accent);
}

.links{
    display:flex;
    gap:30px;
}

.links a{
    text-decoration:none;
    color:var(--text);
    position:relative;
    font-weight:500;
}

.links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-5px;
    width:0;
    height:2px;
    background:var(--accent);
    transition:0.3s;
}

.links a:hover::after{
    width:100%;
}

.theme-toggle{
    cursor:pointer;
    font-size:18px;
}

/* ===== Hero ===== */
.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-size:70px;
    font-weight:800;
    letter-spacing:5px;
    background:linear-gradient(90deg,var(--accent),#fff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:fadeUp 1s ease;
}

.hero p{
    margin-top:20px;
    font-size:18px;
    opacity:.6;
    animation:fadeUp 1.5s ease;
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

/* ===== Sections ===== */
section{
    padding:100px 10%;
}

.card{
    background:var(--glass);
    backdrop-filter:var(--blur);
    padding:40px;
    border-radius:20px;
    transition:0.3s;
    margin-top:30px;
}

.card:hover{
    box-shadow:0 0 40px rgba(139,92,246,.4);
    transform:translateY(-5px);
}

/* ===== Music Player ===== */
.player{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:400px;
    background:var(--glass);
    backdrop-filter:var(--blur);
    padding:15px 25px;
    border-radius:50px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:200;
}

.player button{
    background:none;
    border:none;
    color:var(--text);
    font-size:18px;
    cursor:pointer;
}

.progress{
    flex:1;
    margin:0 15px;
}

.progress input{
    width:100%;
}

/* ===== Scroll Smooth ===== */
html{
    scroll-behavior:smooth;
}

</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<nav>
    <div class="logo" onclick="window.scrollTo(0,0)">LX</div>

    <div class="links">
        <a href="#releases">Releases</a>
        <a href="#links">Links</a>
        <a href="#music">Music</a>
    </div>

    <div class="theme-toggle" onclick="toggleTheme()">🌙</div>
</nav>

<div class="hero">
    <h1>LX PROJECT</h1>
    <p>Independent Digital Platform</p>
</div>

<section id="releases">
    <h2>Releases</h2>
    <div class="card">
        Все проекты 1–20 марта — скоро.
    </div>
</section>

<section id="links">
    <h2>Links</h2>
    <div class="card">
        <p><a href="https://guns.lol/leksik" target="_blank">guns.lol/leksik</a></p>
        <p><a href="https://leksik.carrd.co/" target="_blank">leksik.carrd.co</a></p>
        <p><a href="https://tiktok.com/@sigma.skibiditoilet.rizz" target="_blank">tiktok</a></p>
    </div>
</section>

<section id="music">
    <h2>Music</h2>
    <div class="card">
        Track: Alex
    </div>
</section>

<div class="player">
    <button onclick="togglePlay()">▶</button>
    <div class="progress">
        <input type="range" id="progress" value="0">
    </div>
    <button onclick="audio.volume+=0.1">+</button>
</div>

<audio id="audio" src="alex.mp3"></audio>

<script>
const cursor=document.getElementById("cursor");
document.addEventListener("mousemove",e=>{
    cursor.style.left=e.clientX+"px";
    cursor.style.top=e.clientY+"px";
});

function toggleTheme(){
    document.body.classList.toggle("light");
}

const audio=document.getElementById("audio");
const progress=document.getElementById("progress");

function togglePlay(){
    if(audio.paused){
        audio.play();
    }else{
        audio.pause();
    }
}

audio.addEventListener("timeupdate",()=>{
    progress.value=(audio.currentTime/audio.duration)*100;
});

progress.addEventListener("input",()=>{
    audio.currentTime=(progress.value/100)*audio.duration;
});
</script>

</body>
</html>
